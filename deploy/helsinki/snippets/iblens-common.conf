# IBLens: settings shared by every HTTPS server block of the site.
client_max_body_size 5m;
# Visitors whose DNS still points at REG.RU arrive through the SSH tunnel from 127.0.0.1,
# with their own address in X-Forwarded-For (set by the REG.RU Caddy). The app limits
# analyses per address, so that address has to be the visitor's, not the tunnel's.
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
# Let's Encrypt checks reach this over HTTPS when they come through the REG.RU edge.
location /.well-known/acme-challenge/ { root /var/www/html; }
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml application/manifest+json;
