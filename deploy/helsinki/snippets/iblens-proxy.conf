# IBLens: pass a request to the app. 3000 takes traffic; 3001 (iblens-b) answers while
# 3000 restarts. A request is moved to 3001 only when 3000 refused the connection or did
# not answer in time; a POST that 3000 already received is never sent twice.
proxy_pass http://iblens_app;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_next_upstream error timeout;
proxy_next_upstream_timeout 15s;
proxy_connect_timeout 2s;
# An analysis can run for four minutes before the app answers.
proxy_read_timeout 330s;
proxy_send_timeout 60s;
proxy_hide_header X-Powered-By;
