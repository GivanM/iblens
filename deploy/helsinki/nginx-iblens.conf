# IBLens (iblens.com). Carries over the rules of the REG.RU Caddy block it replaces.
upstream iblens_app {
    server 127.0.0.1:3000 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:3001 backup;
}

server {
    listen 80;
    server_name iblens.com www.iblens.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name iblens.com;
    ssl_certificate /etc/ssl/iblens/iblens.com.crt;
    ssl_certificate_key /etc/ssl/iblens/iblens.com.key;
    include snippets/iblens-common.conf;
    location / { include snippets/iblens-proxy.conf; }
}

# www goes to the bare domain, except the LemonSqueezy webhook, which is registered on www,
# and Let's Encrypt checks (in the common snippet).
server {
    listen 443 ssl;
    server_name www.iblens.com;
    ssl_certificate /etc/ssl/iblens/www.iblens.com.crt;
    ssl_certificate_key /etc/ssl/iblens/www.iblens.com.key;
    include snippets/iblens-common.conf;
    location = /api/lemonsqueezy/webhook { include snippets/iblens-proxy.conf; }
    location / { return 301 https://iblens.com$request_uri; }
}

# Test address for checking this server before the domain moves. Not for search engines.
server {
    listen 80;
    server_name iblens.204-168-182-63.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name iblens.204-168-182-63.sslip.io;
    ssl_certificate /etc/letsencrypt/live/iblens.204-168-182-63.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iblens.204-168-182-63.sslip.io/privkey.pem;
    include snippets/iblens-common.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / { include snippets/iblens-proxy.conf; }
}
